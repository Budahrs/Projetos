<title>Hefestus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<!-- Versão de desenvolvimento: módulos ES precisam de um servidor local
     (ex.: "npx serve" ou "python -m http.server"). Para abrir com duplo clique, use dist/hefestus.html. -->
<div id="app"></div>
<script>
  // Aberto direto do disco (file://), o navegador bloqueia módulos: usa o arquivo único.
  if (location.protocol === "file:") location.replace("dist/hefestus.html");
</script>
<script type="module" src="js/app.js"></script>
