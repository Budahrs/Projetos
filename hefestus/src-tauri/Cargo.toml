[package]
name = "hefestus"
version = "2.1.0"
description = "Hefestus: fábrica visual de programas"
authors = ["Sampietro"]
license = "Apache-2.0"
edition = "2021"

[lib]
# O sufixo _lib evita conflito de nome entre a biblioteca e o executável no Windows.
name = "hefestus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ferramentas incorporadas do Craft (FigCraft). Código em craft/, licença MIT OU Apache-2.0.
figcraft-geom = { path = "craft/geom" }
figcraft-doc = { path = "craft/doc" }
figcraft-pathops = { path = "craft/pathops" }

# Executável menor e mais rápido: https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
