# Incorporado do FigCraft (https://github.com/storytold/figcraft, commit d9c924c), licença MIT OU Apache-2.0.
# Pode ser modificado à vontade; mantenha LICENSE-MIT, LICENSE-APACHE e NOTICE na pasta craft/.
[package]
name = "figcraft-doc"
version = "0.8.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Modelo de documento do FigCraft (tipos usados pelas operações de caminho)"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
figcraft-geom = { path = "../geom" }
figcraft-color = { path = "../color" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
imbl = { version = "7", features = ["serde"] }
